<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Attendaa example RSVP page walkthrough</title><desc id="desc">A fictional Sunday Brunch invitation and RSVP form with an arrow pointing to the Send RSVP button.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#304034" flood-opacity=".14"/></filter><marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M1,1 L11,6.5 L1,12" fill="none" stroke="#c16e62" stroke-width="2.4"/></marker></defs>
  <rect width="1080" height="1350" fill="#faf8f2"/><image href="../attendaa-wordmark.png" x="72" y="56" width="205" height="48" preserveAspectRatio="xMinYMid meet"/>
  <text x="72" y="172" fill="#71846b" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">HOW IT WORKS · FOR GUESTS</text><text x="72" y="230" fill="#304034" font-family="Georgia, serif" font-size="52" font-weight="700">One beautiful link.</text><text x="72" y="286" fill="#304034" font-family="Georgia, serif" font-size="52" font-weight="700">One easy yes.</text>
  <g filter="url(#shadow)"><rect x="73" y="340" width="934" height="780" rx="30" fill="#fffefb"/><rect x="97" y="364" width="430" height="730" rx="18" fill="#e4ecdf"/><image href="attendaa-example-sunday-brunch-flyer.png" x="115" y="387" width="394" height="654" preserveAspectRatio="xMidYMid slice"/><rect x="557" y="364" width="424" height="730" rx="18" fill="#34463c"/><text x="769" y="419" fill="#d7e2cf" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">ATTENDAA SIGNATURE · GARDEN PARTY</text><text x="769" y="472" fill="#fff8ec" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700">Please RSVP</text><rect x="596" y="508" width="348" height="46" rx="23" fill="#fffdf8"/><rect x="596" y="568" width="348" height="46" rx="23" fill="#fffdf8"/><rect x="596" y="628" width="348" height="46" rx="23" fill="#fffdf8"/><text x="616" y="538" fill="#879187" font-family="Arial, sans-serif" font-size="15">Family / Guest Name(s)</text><text x="616" y="598" fill="#879187" font-family="Arial, sans-serif" font-size="15">Email</text><text x="616" y="658" fill="#879187" font-family="Arial, sans-serif" font-size="15">Phone (optional)</text><text x="596" y="717" fill="#e6eee0" font-family="Arial, sans-serif" font-size="14" font-weight="700">Will you be there?</text><rect x="596" y="734" width="104" height="42" rx="21" fill="#f7f6ee"/><rect x="716" y="734" width="104" height="42" rx="21" fill="#f7f6ee"/><rect x="836" y="734" width="108" height="42" rx="21" fill="#f7f6ee"/><text x="648" y="760" fill="#405141" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Yes</text><text x="768" y="760" fill="#405141" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Maybe</text><text x="890" y="760" fill="#405141" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">No</text><rect x="596" y="804" width="348" height="89" rx="13" fill="#fffdf8"/><text x="616" y="836" fill="#879187" font-family="Arial, sans-serif" font-size="15">Send a private note to the host…</text><rect x="675" y="940" width="190" height="52" rx="26" fill="#d78873"/><text x="770" y="973" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">SEND RSVP</text></g>
  <path d="M938 1165 C1000 1120 1000 1030 884 976" fill="none" stroke="#c16e62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="667" y="1140" width="270" height="86" rx="17" fill="#fae6df"/><text x="802" y="1174" fill="#9f514c" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">Guests confirm in seconds</text><text x="802" y="1202" fill="#9f514c" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">then you see it in your hub.</text>
  <text x="72" y="1295" fill="#71846b" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ATTENDAA · PLAN, INVITE, CELEBRATE</text>
</svg>
