<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Attendaa event creation walkthrough</title><desc id="desc">A branded Attendaa event editor visual with arrows highlighting the invitation style selection and Save Event button.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#304034" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M1,1 L11,6.5 L1,12" fill="none" stroke="#c16e62" stroke-width="2.4"/></marker></defs>
  <rect width="1080" height="1350" fill="#faf8f2"/><image href="../attendaa-wordmark.png" x="72" y="56" width="205" height="48" preserveAspectRatio="xMinYMid meet"/>
  <text x="72" y="172" fill="#71846b" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">HOW IT WORKS · CREATE AN EVENT</text><text x="72" y="230" fill="#304034" font-family="Georgia, serif" font-size="52" font-weight="700">Make it feel like</text><text x="72" y="286" fill="#304034" font-family="Georgia, serif" font-size="52" font-weight="700">your celebration.</text>
  <g filter="url(#shadow)"><rect x="73" y="342" width="934" height="760" rx="28" fill="#fffefb"/><text x="120" y="412" fill="#304034" font-family="Georgia, serif" font-size="37" font-weight="700">Create a new event</text><text x="120" y="447" fill="#718071" font-family="Arial, sans-serif" font-size="16">Add the details, choose the feeling, then share your link.</text><text x="120" y="506" fill="#576b58" font-family="Arial, sans-serif" font-size="15" font-weight="700">EVENT TITLE</text><rect x="120" y="524" width="840" height="54" rx="10" fill="#fff" stroke="#d4ddd0" stroke-width="2"/><text x="140" y="558" fill="#304034" font-family="Arial, sans-serif" font-size="18">Sunday Brunch in Bloom</text><text x="120" y="636" fill="#576b58" font-family="Arial, sans-serif" font-size="15" font-weight="700">DATE &amp; TIME</text><rect x="120" y="654" width="405" height="54" rx="10" fill="#fff" stroke="#d4ddd0" stroke-width="2"/><rect x="555" y="654" width="405" height="54" rx="10" fill="#fff" stroke="#d4ddd0" stroke-width="2"/><text x="140" y="688" fill="#566657" font-family="Arial, sans-serif" font-size="17">June 14, 2027</text><text x="575" y="688" fill="#566657" font-family="Arial, sans-serif" font-size="17">11:00 AM</text><text x="120" y="770" fill="#69835e" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ATTENDAA SIGNATURE · INVITATION LOOK</text><rect x="120" y="792" width="194" height="158" rx="15" fill="#f6f4ed" stroke="#cfd9ca" stroke-width="2"/><rect x="338" y="792" width="194" height="158" rx="15" fill="#e2eddf" stroke="#5b7557" stroke-width="5"/><rect x="556" y="792" width="194" height="158" rx="15" fill="#26382f"/><rect x="774" y="792" width="186" height="158" rx="15" fill="#fae2df"/><text x="217" y="875" fill="#4f634f" text-anchor="middle" font-family="Georgia, serif" font-size="24">Classic</text><text x="435" y="866" fill="#3e6340" text-anchor="middle" font-family="Georgia, serif" font-size="24">Garden</text><text x="435" y="893" fill="#3e6340" text-anchor="middle" font-family="Georgia, serif" font-size="20">Party</text><text x="653" y="875" fill="#f5e9cd" text-anchor="middle" font-family="Georgia, serif" font-size="24">Evening</text><text x="867" y="875" fill="#a25651" text-anchor="middle" font-family="Georgia, serif" font-size="24">Big</text><text x="867" y="902" fill="#a25651" text-anchor="middle" font-family="Georgia, serif" font-size="20">Celebration</text><circle cx="504" cy="811" r="14" fill="#5b7557"/><path d="M497 811 L502 816 L512 805" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="740" y="1000" width="220" height="58" rx="12" fill="#5b7557"/><text x="850" y="1037" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">Save Event</text></g>
  <path d="M968 1150 C1040 1090 1008 902 762 868" fill="none" stroke="#c16e62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="680" y="1122" width="285" height="87" rx="17" fill="#fae6df"/><text x="822" y="1157" fill="#9f514c" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">Choose the whole feeling</text><text x="822" y="1185" fill="#9f514c" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">not just a border.</text>
  <path d="M421 1155 C465 1114 635 1070 736 1032" fill="none" stroke="#758d70" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120" y="1124" width="298" height="86" rx="17" fill="#e7f0e4"/><text x="269" y="1158" fill="#52704e" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">Publish when it feels right</text><text x="269" y="1186" fill="#52704e" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">then share one simple link.</text>
  <text x="72" y="1295" fill="#71846b" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ATTENDAA · PLAN, INVITE, CELEBRATE</text>
</svg>
