<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Attendaa host hub walkthrough</title><desc id="desc">A branded Attendaa host hub visual with arrows pointing to New Event and View RSVPs.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#304034" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto"><path d="M1,1 L11,6.5 L1,12" fill="none" stroke="#c16e62" stroke-width="2.4"/></marker></defs>
  <rect width="1080" height="1350" fill="#f6f8f3"/><image href="../attendaa-wordmark.png" x="72" y="56" width="205" height="48" preserveAspectRatio="xMinYMid meet"/>
  <text x="72" y="172" fill="#71846b" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">HOW IT WORKS · FOR HOSTS</text><text x="72" y="230" fill="#304034" font-family="Georgia, serif" font-size="52" font-weight="700">Everything stays</text><text x="72" y="286" fill="#304034" font-family="Georgia, serif" font-size="52" font-weight="700">in one lovely hub.</text>
  <g filter="url(#shadow)"><rect x="73" y="342" width="934" height="730" rx="28" fill="#fffefb"/><rect x="73" y="342" width="934" height="82" rx="28" fill="#f7f8f3"/><circle cx="115" cy="383" r="11" fill="#9db395"/><circle cx="148" cy="383" r="11" fill="#dfb9a9"/><circle cx="181" cy="383" r="11" fill="#e8c783"/><text x="120" y="486" fill="#304034" font-family="Georgia, serif" font-size="39" font-weight="700">My Events</text><text x="120" y="523" fill="#718071" font-family="Arial, sans-serif" font-size="17">Your invitations, guest list, and responses in one place.</text><rect x="768" y="460" width="178" height="52" rx="12" fill="#5b7557"/><text x="857" y="493" fill="#fff" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700">+ New Event</text><rect x="120" y="570" width="840" height="196" rx="20" fill="#fbfcf8" stroke="#dce4d8" stroke-width="2"/><rect x="142" y="594" width="132" height="148" rx="14" fill="#e4ecdf"/><image href="attendaa-example-sunday-brunch-flyer.png" x="152" y="604" width="112" height="128" preserveAspectRatio="xMidYMid slice"/><text x="306" y="622" fill="#304034" font-family="Georgia, serif" font-size="29" font-weight="700">Sunday Brunch in Bloom</text><text x="306" y="658" fill="#718071" font-family="Arial, sans-serif" font-size="16">June 14, 2027 · 11:00 AM</text><text x="306" y="690" fill="#718071" font-family="Arial, sans-serif" font-size="16">The Garden Room</text><rect x="735" y="684" width="190" height="43" rx="10" fill="#eef3eb"/><text x="830" y="712" fill="#4b6649" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700">View RSVPs</text><rect x="120" y="814" width="255" height="175" rx="18" fill="#eaf1e5"/><text x="146" y="857" fill="#60785b" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">RESPONSES</text><text x="146" y="935" fill="#304034" font-family="Georgia, serif" font-size="65" font-weight="700">24</text><text x="146" y="968" fill="#60785b" font-family="Arial, sans-serif" font-size="16">guests have replied</text><rect x="402" y="814" width="255" height="175" rx="18" fill="#fae9e2"/><text x="428" y="857" fill="#a55b53" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ATTENDING</text><text x="428" y="935" fill="#304034" font-family="Georgia, serif" font-size="65" font-weight="700">31</text><text x="428" y="968" fill="#a55b53" font-family="Arial, sans-serif" font-size="16">people expected</text><rect x="684" y="814" width="276" height="175" rx="18" fill="#f9f2df"/><text x="710" y="857" fill="#92743c" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">EVENT STATUS</text><text x="710" y="918" fill="#304034" font-family="Georgia, serif" font-size="32" font-weight="700">Published</text><text x="710" y="957" fill="#92743c" font-family="Arial, sans-serif" font-size="16">ready to share</text></g>
  <path d="M930 1142 C1020 1115 1008 918 934 504" fill="none" stroke="#c16e62" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="683" y="1118" width="250" height="85" rx="17" fill="#fae6df"/><text x="808" y="1153" fill="#9f514c" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">Start another celebration</text><text x="808" y="1181" fill="#9f514c" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">in one click.</text>
  <path d="M421 1146 C470 1090 630 1000 757 728" fill="none" stroke="#758d70" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120" y="1120" width="295" height="87" rx="17" fill="#e7f0e4"/><text x="267" y="1155" fill="#52704e" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700">Check every RSVP</text><text x="267" y="1183" fill="#52704e" text-anchor="middle" font-family="Arial, sans-serif" font-size="15">without chasing texts.</text>
  <text x="72" y="1295" fill="#71846b" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ATTENDAA · PLAN, INVITE, CELEBRATE</text>
</svg>
