[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/baby-shower-wording"
  to = "/baby-shower-wording.html"
  status = 200

[[redirects]]
  from = "/baby-shower-rsvp-reminder"
  to = "/baby-shower-rsvp-reminder.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
